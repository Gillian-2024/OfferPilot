# OfferPilot Nginx —— 放 /etc/nginx/sites-available/offerpilot 并软链到 sites-enabled
#
# 架构说明：Next 单进程同源托管 API + 页面，无需前后端分流。
# Cloudflare 橙云 + Full(strict)：CF 到源站也走 HTTPS 并校验证书，
# 故源站必须装 Let's Encrypt 真证书（自签会被 strict 拒绝）。

# HTTP：仅保留 ACME 校验路径，其余跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name offerpilot.win www.offerpilot.win;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name offerpilot.win www.offerpilot.win;

    ssl_certificate     /etc/letsencrypt/live/offerpilot.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offerpilot.win/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 取回真实客户端 IP（经 Cloudflare 后 remote_addr 是 CF 节点）
    # CF 段列表随官方更新：https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # 简历上传：留出余量（Next 侧自身也有限制）
    client_max_body_size 20m;

    # AI 流式输出（SSE）：禁用缓冲，否则前端拿不到增量
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
